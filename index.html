<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbers Quiz - Gotdle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Climbers Quiz</h1>
  <div class="greeting" id="greeting">Welcome, Guest!</div>

  <div class="container">
    <!-- Adam Ondra card -->
    <div class="card" data-climber="adam" onclick="showInfo('adam')">
      <img src="https://img.olympics.com/images/image/private/t_1-1_300/f_auto/v1707489700/primary/ryohdpaupufrjqfdbzri" alt="Adam Ondra">
      <h2>Adam Ondra</h2>
    </div>

    <!-- Mejdi Schalck card -->
    <div class="card" data-climber="mejdi" onclick="showInfo('mejdi')">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlvGqSQooH2iXwVl6e9LVLuZGhv894qRvUmA&s" alt="Mejdi Schalck">
      <h2>Mejdi Schalck</h2>
    </div>

    <!-- Alex Honnold card -->
    <div class="card" data-climber="alex" onclick="showInfo('alex')">
      <img src="https://media.gq.com/photos/5a09ff16b145834e27c427e0/4:3/w_3347,h_2510,c_limit/Alex%20Honnold-1217-GQ-MORG01-01.jpg" alt="Alex Honnold">
      <h2>Alex Honnold</h2>
    </div>

    <!-- Janja Garnbret card -->
    <div class="card" data-climber="janja" onclick="showInfo('janja')">
      <img src="https://i0.wp.com/thehill.com/wp-content/uploads/sites/2/2024/08/66b75d8c823191.22814523.jpeg?w=2000&ssl=1" alt="Janja Garnbret">
      <h2>Janja Garnbret</h2>
    </div>

    <!-- Magnus Midtbø card -->
    <div class="card" data-climber="magnus" onclick="showInfo('magnus')">
      <img src="https://altitudeclimbing.com/wp-content/uploads/2025/06/retreat-kalymnos-april-2026-3-Magnus-Midtbo@2x.jpg" alt="Magnus Midtbø">
      <h2>Magnus Midtbø</h2>
    </div>
  </div>

  <!-- Popup section -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h2 id="popup-title"></h2>
      <img id="popup-image" class="popup-image" alt="Climber">
      <p id="popup-text"></p>

      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="close-btn" onclick="closePopup()">Close</button>
        <button class="close-btn" style="background: #4CAF50;" onclick="startQuiz()">Quiz</button>
      </div>
    </div>
  </div>

  <div class="login-modal" id="login-modal">
    <div class="login-box">
      <h2>Welcome to Climbers Quiz</h2>
      <p>Enter your name to save your quiz wins and get a better experience.</p>
      <input id="player-name-input" type="text" placeholder="Your name" maxlength="24" />
      <button class="quiz-btn" onclick="savePlayerName()">Start Playing</button>
    </div>
  </div>

  <div class="wins-modal" id="wins-modal">
    <div class="wins-modal-content">
      <p id="wins-modal-text">Number of wins in this quiz</p>
      <button class="quiz-btn" onclick="closeWinsModal()">Close</button>
    </div>
  </div>

  <!-- Quiz Page -->
  <div class="quiz-container" id="quiz-container">
    <div class="quiz-content">
      <h2 id="quiz-title">Quiz</h2>
      <p id="question-number"></p>
      <div id="question-container"></div>
      <div id="answers-container"></div>
      <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="quiz-btn" onclick="previousQuestion()">Previous</button>
        <button class="quiz-btn" onclick="nextQuestion()">Next</button>
        <button class="quiz-btn" style="background: #4CAF50;" onclick="finishQuiz()">Finish</button>
        <button class="quiz-btn" style="background: #d32f2f;" onclick="quitQuiz()">Quit</button>
      </div>
    </div>
  </div>

  <!-- Quiz Results Page -->
  <div class="results-container" id="results-container">
    <div class="results-content">
      <h2>Quiz Results</h2>
      <p id="score-display"></p>
      <div id="review-container"></div>
      <button class="quiz-btn" style="background: #4CAF50;" onclick="closeResults()">Back to Home</button>
    </div>
  </div>

  <!-- External JavaScript file -->
  <script type="module" src="java.js"></script>
</body>

</html>

</html> <!-- Ends HTML document -->
