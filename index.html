    // Function to create and animate particles on homepage
    function createParticles() {
      // Create 30 particles
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const particle = document.createElement("div");
          particle.className = "particle";
          
          // Random size between 2-6px
          const size = Math.random() * 4 + 2;
          particle.style.width = size + "px";
          particle.style.height = size + "px";
          particle.style.backgroundColor = "rgba(218, 165, 32, " + (Math.random() * 0.6 + 0.4) + ")";
          particle.style.borderRadius = "50%";
          particle.style.left = Math.random() * window.innerWidth + "px";
          particle.style.top = window.innerHeight + "px";
          
          // Random duration between 8-15 seconds
          const duration = Math.random() * 7 + 8;
          particle.style.animation = "float " + duration + "s linear forwards, glow 3s ease-in-out infinite";
          particle.style.animationDelay = "0s, " + (Math.random() * 2) + "s";
          
          document.body.appendChild(particle);
          
          // Remove particle after animation ends
          setTimeout(() => {
            particle.remove();
          }, duration * 1000);
        }, i * 200);
      }
    }

    // Function to clean up particles when entering quiz
    function cleanupParticles() {
      const particles = document.querySelectorAll(".particle");
      particles.forEach(p => p.remove());
    }

    // Create initial particles on page load
    window.addEventListener("load", () => {
      createParticles();
    });

    // Keep creating particles continuously
    setInterval(() => {
      if (document.getElementById("quiz-container").style.display !== "flex" && 
          document.getElementById("results-container").style.display !== "flex") {
        createParticles();
      }
    }, 5000);

    // Global quiz state
    let currentQuiz = null;
    let currentClimber = null;
    let currentQuestion = 0;
    let shuffledQuestions = [];
    let userAnswers = [];
    let questionData = []; // Stores shuffled answers and correct indices

    // Helper function to shuffle array
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // Helper function to find index of element in array
    function findIndex(array, element) {
      for (let i = 0; i < array.length; i++) {
        if (array[i] === element) return i;
      }
      return -1;
    }

    // Function that shows popup info
    function showInfo(climber) {

      // Sets popup title text
      document.getElementById("popup-title").innerText = climbers[climber].name;

      // Sets popup image
      document.getElementById("popup-image").src = climberImages[climber];
      document.getElementById("popup-image").alt = climbers[climber].name;

      // Sets popup info text
      document.getElementById("popup-text").innerText = climbers[climber].info;

      // Store current climber for quiz
      currentClimber = climber;

      // Makes popup visible
      document.getElementById("popup").style.display = "flex";
    }

    // Function to close popup
    function closePopup() {

      // Hides popup
      document.getElementById("popup").style.display = "none";
    }

    // Function to start quiz
    function startQuiz() {
      if (!currentClimber) return;

      // Shuffle questions and select 5
      shuffledQuestions = [...quizzes[currentClimber]].sort(() => Math.random() - 0.5).slice(0, 5);
      userAnswers = new Array(shuffledQuestions.length).fill(null);
      currentQuestion = 0;
      questionData = [];

      // Shuffle answers and track correct indices for each question
      shuffledQuestions.forEach((question) => {
        if (question.type === "picture") {
          // Shuffle picture positions
          const shuffledPositions = shuffleArray(question.imagePositions);
          const correctPosition = question.imagePositions[question.correct];
          const newCorrectIndex = findIndex(shuffledPositions, correctPosition);
          
          questionData.push({
            shuffledPositions: shuffledPositions,
            correctIndex: newCorrectIndex
          });
        } else {
          // Shuffle text answers
          const correctAnswer = question.answers[question.correct];
          const shuffledAnswers = shuffleArray(question.answers);
          const newCorrectIndex = findIndex(shuffledAnswers, correctAnswer);
          
          questionData.push({
            shuffledAnswers: shuffledAnswers,
            correctIndex: newCorrectIndex
          });
        }
      });

      // Clean up particles before showing quiz
      cleanupParticles();

      // Hide popup and show quiz
      document.getElementById("popup").style.display = "none";
      document.getElementById("quiz-container").style.display = "flex";

      // Display first question
      displayQuestion();
    }

    // Function to display current question
    function displayQuestion() {
      const question = shuffledQuestions[currentQuestion];
      document.getElementById("quiz-title").innerText = climbers[currentClimber].name + " Quiz";
      document.getElementById("question-number").innerText = "Question " + (currentQuestion + 1) + " of " + shuffledQuestions.length;

      if (question.type === "picture") {
        displayPictureQuestion(question);
      } else {
        displayTextQuestion(question);
      }
    }

    // Function to display text question
    function displayTextQuestion(question) {
      const container = document.getElementById("question-container");
      container.innerHTML = "<h3>" + question.question + "</h3>";

      const answersContainer = document.getElementById("answers-container");
      answersContainer.innerHTML = "";
      answersContainer.style.display = "flex";
      answersContainer.style.flexDirection = "column";

      const data = questionData[currentQuestion];
      const shuffledAnswers = data.shuffledAnswers;

      shuffledAnswers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer-option";
        if (userAnswers[currentQuestion] === index) {
          button.classList.add("selected");
        }
        button.innerText = answer;
        button.onclick = () => selectAnswer(index);
        answersContainer.appendChild(button);
      });
    }

    // Function to display picture question
    function displayPictureQuestion(question) {
      const container = document.getElementById("question-container");
      container.innerHTML = "<h3>" + question.question + "</h3>";

      const answersContainer = document.getElementById("answers-container");
      answersContainer.innerHTML = "";
      answersContainer.style.display = "grid";
      answersContainer.style.gridTemplateColumns = "repeat(auto-fit, minmax(120px, 1fr))";

      const data = questionData[currentQuestion];
      const shuffledPositions = data.shuffledPositions;

      shuffledPositions.forEach((climberKey, index) => {
        const div = document.createElement("div");
        div.className = "picture-option";
        if (userAnswers[currentQuestion] === index) {
          div.classList.add("selected");
        }
        div.style.cursor = "pointer";
        div.innerHTML = "<img src='" + climberImages[climberKey] + "' alt='" + climbers[climberKey].name + "'>";
        div.onclick = () => selectAnswer(index);
        answersContainer.appendChild(div);
      });
    }

    // Function to select answer
    function selectAnswer(index) {
      userAnswers[currentQuestion] = index;

      // Update display
      displayQuestion();
    }

    // Function to go to next question
    function nextQuestion() {
      if (currentQuestion < shuffledQuestions.length - 1) {
        currentQuestion++;
        displayQuestion();
      }
    }

    // Function to go to previous question
    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        displayQuestion();
      }
    }

    // Function to finish quiz
    function finishQuiz() {
      // Calculate score
      let score = 0;
      for (let i = 0; i < shuffledQuestions.length; i++) {
        if (userAnswers[i] === questionData[i].correctIndex) {
          score++;
        }
      }

      // Display results
      document.getElementById("quiz-container").style.display = "none";
      document.getElementById("results-container").style.display = "flex";

      // Show score
      document.getElementById("score-display").innerText = "You scored " + score + " out of " + shuffledQuestions.length + "!";

      // Show review
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";

      for (let i = 0; i < shuffledQuestions.length; i++) {
        const question = shuffledQuestions[i];
        const data = questionData[i];
        const isCorrect = userAnswers[i] === data.correctIndex;
        const reviewItem = document.createElement("div");
        reviewItem.className = "review-item " + (isCorrect ? "correct" : "incorrect");

        let answerText = "";
        if (question.type === "picture") {
          const userSelectedClimber = data.shuffledPositions[userAnswers[i]] || "unknown";
          const correctClimber = data.shuffledPositions[data.correctIndex];
          answerText = "You selected: <strong>" + climbers[userSelectedClimber].name + "</strong><br>";
          answerText += "Correct answer: <strong>" + climbers[correctClimber].name + "</strong>";
        } else {
          answerText = "You selected: <strong>" + (data.shuffledAnswers[userAnswers[i]] || "No answer") + "</strong><br>";
          answerText += "Correct answer: <strong>" + data.shuffledAnswers[data.correctIndex] + "</strong>";
        }

        const status = isCorrect ? "✓ Correct" : "✗ Incorrect";
        reviewItem.innerHTML = "<strong>" + (i + 1) + ". " + question.question + "</strong> - " + status + "<br>" + answerText;
        reviewContainer.appendChild(reviewItem);
      }
    }

    // Function to close results and go back
    function closeResults() {
      document.getElementById("results-container").style.display = "none";
      document.getElementById("popup").style.display = "flex";
      currentQuestion = 0;
      shuffledQuestions = [];
      userAnswers = [];
      questionData = [];
      // Recreate particles when returning to homepage
      createParticles();
    }
